<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix - Login</title>
    <link rel="icon" href="icons/icon.png">
    <link rel="stylesheet" href="login.css">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <!-- **** Background ****  -->

    <div>
        <img class="img-bg" src="icons/netflix-bg.jpg" alt="">
    </div>

    <!-- **** Header Section ****  -->

    <header>
        <a href="index.html"><img class="logo" src="icons/logo.png" alt=""></a>
    </header>

    <!-- **** Login Form **** -->

    <div class="login-box">
        <h2>Sign In</h2>

        <div class="input-box">
            <input type="text" placeholder="Email or phone number">
            <input type="password" placeholder="Password">
            <button>Sign In</button>
        </div>

        <div class="rememberme-box">
            <div>
                <input type="checkbox">
                <label for="remember-me">Remember Me</label>
            </div>

            <p>Need Help?</p>
        </div>

        <div class="signup-box">
            <p>New user?<span><a href="index.html">Sign up now</a></span></p>
            <p class="sm-text">This page is protected by Google reCAPTCHA to ensure you're a bot.<span ><a href ="https://cloud.google.com/security/products/recaptcha">Learn
                    more</a></span></p>
        </div>

    </div>

    <!-- **** footer section **** -->

    <div class="footer">
        <h2>Questions? call 000-800-919-1694</h2>

        <div class="row">

            <div class="col">
                <a href="#">FAQ</a>
                <a href="#">Cookies Preferences</a>
            </div>

            <div class="col">
                <a href="#">Help Center</a>
                <a href="#">Corporate Information</a>
            </div>

            <div class="col">
                <a href="#">Terms of Use</a>
            </div>

            <div class="col">
                <a href="#">Privacy</a>
            </div>

        </div>
        <select class="language-btn">
            <option value="">English</option>
            <option value="">Hindi</option>
            <img src="icons/feature-2.png" alt="">
        </select>

        <div class="developer">
            <p>made with lots of LOVE</p>
            <small>&copy;ABC</small>
        </div>

    </div>

</body>

</html>
